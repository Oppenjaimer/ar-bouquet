<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script src="aframe.min.js"></script>
    <script src="aframe-ar.js"></script>
    <title>Bouquet)))</title>

    <style>
        #note-2d {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            font-family: "Georgia", serif;
        }
        .paper {
            background: #fff8e7;
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            width: 80%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 10px; right: 15px;
            font-size: 24px;
            font-weight: bold;
            color: #555;
            cursor: pointer;
        }
    </style>

    <script>
        AFRAME.registerComponent("open-note", {
            init: function () {
                this.el.addEventListener("click", function () {
                    document.getElementById("note-2d").style.display = "flex";
                });
            }
        });

        function closeNote() {
            document.getElementById("note-2d").style.display = "none";
        }
    </script>
</head>

<body style="margin: 0; overflow: hidden;">
    <div id="note-2d">
        <div class="paper">
            <span class="close-btn" onclick="closeNote()">×</span>
            <p style="font-size: 1.15em; line-height: 1.6; color: #2c3e50; margin-bottom: 25px;">
                Para mi <b style="color: #c0392b;">espía del PCCh favorita</b>, de quien tan orgulloso estoy y a quien <i style="color: #c0392b;">nunca le van a faltar flores</i>, sin importar lo lejos que se me vaya.
            </p>

            <p style="font-size: 1.05em; color: #444; line-height: 1.5; font-style: italic; margin-bottom: 25px;">
                Por chulo que quede, la próxima vez que te dé flores no será un ramo giratorio. Lo bueno es que podré dártelas en persona.
            </p>

            <p style="font-size: 1.4em; font-weight: bold; color: #c0392b; margin-top: 30px; text-shadow: 1px 1px 2px rgba(0,0,0,0.1);">
                Te quiero mucho.
            </p>
        </div>
    </div>

    <a-scene
        embedded
        arjs="sourceType: webcam; debugUIEnabled: false;"
        cursor="rayOrigin: mouse"
        raycaster="objects: .clickable">

        <a-marker type="pattern" url="marker.patt">
            <a-entity
                gltf-model="url(bouquet.glb)"
                scale="8 8 8"
                position="0 1 0"
                rotation="0 0 0"
                animation__rotate="property: rotation; dur: 10000; easing: linear; dir: normal; from:0 0 0; to: 0 360 0; loop: true;">
            </a-entity>

            <a-plane
                class="clickable"
                open-note
                position="2 0.5 0"
                rotation="-90 0 0"
                width="1.5"
                height="1"
                color="#ffcccc"
                text="value: TOCA AQUI; color: #c0392b; align: center; width: 5; font: mozillavr;">
            </a-plane>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
