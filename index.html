<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script src="aframe.min.js"></script>
    <script src="aframe-ar.js"></script>
    <title>Bouquet)))</title>

    <style>
        #note-2d {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            font-family: "Georgia", serif;
        }
        .paper {
            background: #fff8e7;
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            width: 80%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 10px; right: 15px;
            font-size: 24px;
            font-weight: bold;
            color: #555;
            cursor: pointer;
        }
    </style>

    <script>
        AFRAME.registerComponent("open-note", {
            init: function () {
                const el = this.el;
                const scene = el.sceneEl;
                const corner = new THREE.Vector3();
                const corners = [[-1, -1], [1, -1], [1, 1], [-1, 1]];

                function insideQuad(p, q) {
                    let sign = 0;

                    for (let i = 0; i < 4; i++) {
                        const a = q[i], b = q[(i + 1) % 4];
                        const cross = (b.x - a.x) * (p.y - a.y) - (b.y - a.y) * (p.x - a.x);

                        if (cross !== 0) {
                            const s = (cross > 0) ? 1 : -1;

                            if (sign === 0) sign = s;
                            else if (s !== sign) return false;
                        }
                    }

                    return true;
                }

                function onPointer(e) {
                    if (document.getElementById("note-2d").style.display === "flex") return;
                    if (!el.object3D.visible || !el.parentEl.object3D.visible) return;

                    const camera = scene.camera;
                    const canvas = scene.canvas;
                    if (!camera || !canvas) return;

                    camera.updateMatrixWorld(true);
                    el.object3D.updateWorldMatrix(true, false);

                    const w = (el.getAttribute("width") || 1) / 2;
                    const h = (el.getAttribute("height") || 1) / 2;
                    const rect = canvas.getBoundingClientRect();
                    const pts = [];

                    for (const [cx, cy] of corners) {
                        corner.set(cx * w, cy * h, 0);
                        el.object3D.localToWorld(corner);
                        corner.project(camera);

                        if (corner.z > 1) return;

                        pts.push({
                            x: rect.left + (corner.x + 1) / 2 * rect.width,
                            y: rect.top + (1 - corner.y) / 2 * rect.height
                        });
                    }

                    if (insideQuad({ x: e.clientX, y: e.clientY }, pts)) {
                        document.getElementById("note-2d").style.display = "flex";
                    }
                }

                window.addEventListener("pointerdown", onPointer);
            }
        });

        function closeNote() {
            document.getElementById("note-2d").style.display = "none";
        }
    </script>
</head>

<body style="margin: 0; padding: 0; overflow: hidden; width: 100vw; height: 100vh;">
    <div id="note-2d" onclick="if (event.target === this) closeNote()">
        <div class="paper">
            <span class="close-btn" onclick="closeNote()">×</span>
            <p style="font-size: 1.15em; line-height: 1.6; color: #2c3e50; margin-bottom: 25px;">
                Para mi <b style="color: #c0392b;">espía del PCCh favorita</b>, de quien tan orgulloso estoy y a quien <i style="color: #c0392b;">nunca le van a faltar flores</i>, sin importar lo lejos que se me vaya.
            </p>

            <p style="font-size: 1.05em; color: #444; line-height: 1.5; font-style: italic; margin-bottom: 25px;">
                Por chulo que quede, la próxima vez que te dé flores no será un ramo giratorio. Lo bueno es que podré dártelas en persona.
            </p>

            <p style="font-size: 1.4em; font-weight: bold; color: #c0392b; margin-top: 30px; text-shadow: 1px 1px 2px rgba(0,0,0,0.1);">
                Te quiero mucho.
            </p>
        </div>
    </div>

    <a-scene
        embedded
        vr-mode-ui="enabled: false"
        arjs="sourceType: webcam; debugUIEnabled: false;">

        <a-marker type="pattern" url="marker.patt">
            <a-entity
                gltf-model="url(bouquet.glb)"
                scale="8 8 8"
                position="0 1 0"
                rotation="0 0 0"
                animation__rotate="property: rotation; dur: 10000; easing: linear; dir: normal; from:0 0 0; to: 0 360 0; loop: true;">
            </a-entity>

            <a-plane
                open-note
                position="2 0.5 0"
                rotation="-90 0 0"
                width="1.5"
                height="1"
                color="#ffcccc"
                material="side: double"
                text="value: TOCA AQUI; color: #c0392b; align: center; width: 5; font: mozillavr; zOffset: 0.05;">
            </a-plane>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
